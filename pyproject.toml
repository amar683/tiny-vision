[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-vision"
version = "1.0.0"
description = "Let your AI assistant watch videos: a 36M-param local image/video captioner with an MCP server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["mcp", "video", "image-captioning", "vision", "llm", "local"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "torch>=2.5",
    "torchvision",
    "pillow",
    "opencv-python-headless",
    "numpy",
    "transformers",
    "huggingface_hub",
    "safetensors",
    "mcp>=2.3",
]

[project.optional-dependencies]
train = ["datasets"]

[project.scripts]
tiny-vision = "caption:main"
tiny-vision-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/amar683/tiny-vision"
Model = "https://huggingface.co/amartomar683/tiny-vision"

[tool.setuptools]
packages = ["vlm"]
py-modules = ["caption", "mcp_server"]
